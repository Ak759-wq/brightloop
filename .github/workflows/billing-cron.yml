name: Recurring billing run

# Triggers the server-side billing runner once a day (and on demand).
# Customer page visits never trigger billing.
on:
  schedule:
    - cron: "30 0 * * *" # 00:30 UTC = 06:00 IST
  workflow_dispatch: {}

concurrency:
  group: billing-run
  cancel-in-progress: false

jobs:
  run-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call POST /api/billing/run
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set APP_URL and CRON_SECRET repository secrets"; exit 1
          fi
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$APP_URL/api/billing/run" -H "x-cron-secret: $CRON_SECRET" -H "content-type: application/json" --max-time 90 || echo 000)
            cat response.json || true; echo
            if [ "$status" = "200" ]; then
              if grep -q '"status":"failed"' response.json; then echo "::error::Billing run reported failure"; exit 1; fi
              exit 0
            fi
            echo "Attempt $attempt failed with HTTP $status; retrying in 30s"; sleep 30
          done
          echo "::error::Billing run failed after 3 attempts"; exit 1
